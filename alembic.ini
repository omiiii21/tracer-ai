# Alembic config -- repo root per D-2.16
# sqlalchemy.url is OVERRIDDEN by alembic/env.py from tracer_ai.config.settings.database_url
# (single source of truth). Do not set a real DSN here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder

[post_write_hooks]
# (placeholder for future ruff-format hook on generated revisions)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
