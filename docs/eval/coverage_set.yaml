# /docs/eval/coverage_set.yaml
# Proactive coverage regression query set for tracer-ai (DSGN-10)
# 12 queries — exceeds DSGN-10 floor of 10
#
# Authoring constraints (D-31 through D-35):
#   - Hand-curated against Claude API docs TOC (NOT LLM-generated)
#   - No ground-truth answer text — asserts retrieval coverage only
#   - expected_min_score: 0.6 (initial; calibrated in Phase 5 EVAL-06)
#
# Schema per entry (D-32):
#   id: COV-NN (zero-padded 2-digit, sequential)
#   query: str — the user-facing question text
#   doc_section: str — canonical taxonomy (must match Phase 3 chunker)
#   expected_chunk_keywords: list[str] — at least one MUST appear in retrieved chunks
#   expected_min_score: float — initial 0.6; tuned by EVAL-06
#   notes: str — provenance / source URL hint
#
# Phase 6 CLI-02 (eval/regression.py) loads this file via yaml.safe_load()
# and asserts retrieval coverage per query. Phase 5 may rewrite
# expected_min_score and expected_chunk_keywords during calibration.

- id: COV-01
