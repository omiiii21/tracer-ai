[project]
name = "tracer-ai"
version = "0.1.0"
description = "Portfolio-grade RAG chatbot with custom OTel-aligned observability"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "tracer-ai contributors" }]
dependencies = [
  "fastapi>=0.128,<0.129",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.31",
  "pgvector>=0.3,<0.4",
  "alembic>=1.13,<2.0",
  "uvicorn[standard]>=0.30,<0.40",
  "anthropic>=0.49,<1.0",
  "voyageai>=0.3,<1.0",
  "sentence-transformers>=3.0,<4.0",
  "structlog>=24.1,<25.0",
  "tiktoken>=0.7,<1.0",
  "httpx>=0.27,<0.30",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-testmon>=2.2,<3.0",
  "pre-commit>=3.7,<5.0",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracer_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tracer_ai"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["voyageai.*", "pgvector.*", "sentence_transformers.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.uv]
# uv-specific config (uv.lock generation)
